<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b4a37" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1210" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JEC Alumni" />
    <meta name="description" content="JEC Alumni Connect: every JECian, one tap away. Register for the JEC Alumni Meet 2026." />
    <meta property="og:title" content="JEC Alumni Connect" />
    <meta property="og:description" content="Register for the JEC Alumni Meet 2026 (batches 2001–2010) and reconnect with your batch." />
    <meta property="og:image" content="/pwa-512.png" />
    <title>JEC Alumni Connect</title>
      <style>
      .splash { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; background: linear-gradient(160deg, #0b4a37, #062a20); color: #e8f3ed; font: 600 15px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.02em; }
      .splash-mark { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,0.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); font: 800 26px/1 system-ui, sans-serif; color: #fff; animation: splash-pulse 1.4s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) { .splash-mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- shown instantly while the app loads; replaced as soon as the app starts -->
      <div class="splash" role="status" aria-label="Loading JEC Alumni Connect">
        <div class="splash-mark">JEC</div>
        <p>JEC Alumni Connect</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
