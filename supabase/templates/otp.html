<!doctype html>
<html>
  <body style="margin:0;background:#f6f7fb;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1d2433">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px">
            <tr><td style="font-size:14px;font-weight:700;color:#14306B;letter-spacing:.04em">JEC ALUMNI CONNECT</td></tr>
            <tr><td style="padding-top:16px;font-size:22px;font-weight:700">Your sign-in code</td></tr>
            <tr><td style="padding-top:8px;font-size:15px;color:#5b6475">Enter this code in the app to sign in. It expires in 1 hour.</td></tr>
            <tr>
              <td style="padding:24px 0">
                <div style="font-size:34px;font-weight:700;letter-spacing:10px;text-align:center;background:#eaf0fb;color:#14306B;border-radius:12px;padding:16px 0">{{ .Token }}</div>
              </td>
            </tr>
            <tr><td style="font-size:13px;color:#5b6475">If you didn’t try to sign in, you can ignore this email. Never share this code with anyone.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
